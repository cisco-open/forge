---
# yamllint disable rule:comments
# yamllint disable rule:truthy
name: InfraScan Security Audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {} # Default deny; jobs declare only the permissions they need.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  infrascan:
    name: Run InfraScan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read # Required to checkout repository content for scanning.
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare InfraScan input
        shell: bash
        run: |
          rm -rf .infrascan-src
          mkdir -p .infrascan-src
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.infrascan-src/' \
            --exclude='docs/' \
            --exclude='test/' \
            --exclude='tests/' \
            --exclude='example/' \
            --exclude='examples/' \
            --exclude='*.tftest.hcl' \
            ./ .infrascan-src/

      - name: Run InfraScan
        uses: soldevelo/infrascan@d014b41beb18257680965b5c07d9d53de53bc042 # v1.2.2
        with:
          directory: .infrascan-src
          scanner: comprehensive
          format: html
          out: infrascan-report.html
          fail-on: high_critical

      - name: Upload HTML report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: infrascan-report
          path: infrascan-report.html

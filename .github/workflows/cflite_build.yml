---
# yamllint disable rule:comments
# yamllint disable rule:truthy
name: ClusterFuzzLite Continuous Builds

on:
  push:
    branches:
      - main
    paths:
      - .clusterfuzzlite/**
      - .github/workflows/cflite_*.yml
      - modules/**/lambda/**
      - fuzz/**
      - pyproject.toml
      - uv.lock

permissions: {} # Default deny; jobs declare only the permissions they need.

jobs:
  build:
    name: Build Python fuzzers (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.sanitizer }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read # Required to checkout repository content for fuzz builds.
    strategy:
      fail-fast: false
      matrix:
        sanitizer:
          - address
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build fuzzers (${{ matrix.sanitizer }})
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: ${{ matrix.sanitizer }}
          upload-build: true

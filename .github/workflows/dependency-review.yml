---
# yamllint disable rule:comments
# yamllint disable rule:truthy
name: Dependency Review

on:
  pull_request:
    branches:
      - main

permissions: {} # Default deny; jobs declare only the permissions they need.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependency-review:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to read dependency manifests from the checkout.
      pull-requests: write # Required to publish the dependency review summary comment.
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          comment-summary-in-pr: always

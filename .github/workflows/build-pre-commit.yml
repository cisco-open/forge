---
# yamllint disable rule:comments
# yamllint disable rule:truthy
name: Docker image [pre-commit]

on:
  push:
    branches:
      - main
    tags:
      - v*
    paths:
      - .docker/pre-commit/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/build-pre-commit.yml
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
      - renovatebot
    paths:
      - .docker/pre-commit/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/build-pre-commit.yml

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PLATFORMS: linux/amd64
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-pre-commit

jobs:
  build-and-push-image:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the repository.
      packages: write # Required to publish container images to GHCR.

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          platforms: ${{ env.PLATFORMS }}

      - name: Log in to the Container registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Resolve PR test image
        id: image
        shell: bash
        run: |
          set -euo pipefail

          echo "image=${REGISTRY}/${IMAGE_NAME}:pr-test-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Build and push Docker image [pre-commit]
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .docker/pre-commit/Dockerfile
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ github.event_name == 'pull_request' && steps.image.outputs.image || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test-image:
    if: github.event_name == 'pull_request'
    name: Test Docker image [pre-commit]
    runs-on: ubuntu-latest
    needs: build-and-push-image
    permissions:
      contents: read # Required to checkout the repository.
      packages: read # Required to pull the PR image from GHCR.
    container:
      image: ${{ needs.build-and-push-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Cache pre-commit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit/
          key: pre-commit|${{ github.repository }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Cache OpenTofu providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /github/home/.terraform.d/plugin
          key: tf-providers-${{ github.run_id }}
          restore-keys: |
            tf-providers

      - name: Set Terraform plugin cache
        shell: bash
        run: |
          set -euo pipefail

          echo "TF_PLUGIN_CACHE_DIR=/github/home/.terraform.d/plugin" >> "${GITHUB_ENV}"

      - name: Mark repository as safe
        shell: bash
        run: |
          set -euo pipefail

          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Run pre-commit in all files
        shell: bash
        run: |
          set -euo pipefail

          pre-commit --version
          bandit --version
          pip-audit --version
          uv --version
          tofu version
          tflint --version
          pre-commit run --show-diff-on-failure --color=always --all-files | tee pre-commit.log

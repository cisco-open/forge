---
# yamllint disable rule:comments
# yamllint disable rule:truthy
name: Pre-commit Code Quality Checks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
      - renovatebot
  push:
    branches:
      - main

permissions:
  contents: read # Required to checkout and lint the repository.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  run-pre-commit:
    name: Run pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/cisco-open/forge-pre-commit:main@sha256:51127f81bc41e09c6306822f6c81911abc51b6745d663d8d4af4683cde8415e7

    if: github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Cache Pre-commit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit/
          key: pre-commit|${{ github.repository }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Cache OpenTofu providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /github/home/.terraform.d/plugin
          key: tf-providers-${{ github.run_id }}
          restore-keys: |
            tf-providers

      - name: Set Terraform plugin cache
        run: echo "TF_PLUGIN_CACHE_DIR=/github/home/.terraform.d/plugin" >> $GITHUB_ENV

      - name: Mark repository as safe
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Ensure pre-commit system tools
        shell: bash
        run: |
          set -euo pipefail

          if command -v uv >/dev/null 2>&1 && command -v bandit >/dev/null 2>&1 && command -v pip-audit >/dev/null 2>&1; then
              exit 0
          fi

          uv_version="$(
              python3.12 <<'PY'
          import tomllib

          data = tomllib.load(open("pyproject.toml", "rb"))
          print(next(
              dep.removeprefix("uv==")
              for dep in data["dependency-groups"]["pre-commit-image"]
              if dep.startswith("uv==")
          ))
          PY
          )"
          pip install --no-cache-dir --break-system-packages "uv==${uv_version}"
          uv export --locked --only-group pre-commit-image --format requirements-txt --no-hashes > /tmp/pre-commit-image-requirements.txt
          pip install --no-cache-dir --break-system-packages --ignore-installed -r /tmp/pre-commit-image-requirements.txt
          rm /tmp/pre-commit-image-requirements.txt

      - name: Run pre-commit in all files
        shell: bash
        run: pre-commit run --show-diff-on-failure --color=always --all-files | tee pre-commit.log

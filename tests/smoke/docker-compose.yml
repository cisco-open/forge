---
# MiniStack for Forge smoke tests. No auth token, no account.
#   docker compose up -d
# Pin to a real tag for reproducibility (check Docker Hub for current versions),
# e.g. ministackorg/ministack:1.1.0 - :latest shown here for convenience.
services:
  ministack:
    # "MiniStack" is the kit's placeholder; the real emulator is LocalStack
    # (see docs-improvement/LOCALSTACK.md), Community edition, token-free,
    # serving S3/SQS/SSM/STS/IAM/EventBridge/Lambda on :4566. Override/pin via
    # MINISTACK_IMAGE.
    image: ${MINISTACK_IMAGE:-localstack/localstack:latest}
    container_name: forge-ministack
    ports:
      - 127.0.0.1:4566:4566
    volumes:
      # Needed only for the lambda_exec smoke test (MiniStack spawns a container
      # per function via the host Docker socket). Safe to drop for plumbing-only.
      - /var/run/docker.sock:/var/run/docker.sock

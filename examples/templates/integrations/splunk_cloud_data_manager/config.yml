---
splunk_cloud: <SPLUNK_CLOUD_URL>                # e.g., https://mycompany.splunkcloud.com

cloudformation_s3_config:
  bucket: <S3_BUCKET_NAME>                  # e.g., 123456789012-short-term-storage
  key: <S3_KEY_PREFIX>                      # e.g., cicd_artifacts/cf-templates/
  region: <AWS_REGION>                      # e.g., eu-west-1

cloudwatch_log_groups_config:
  enabled: <CWL_ENABLED>                    # true or false
  name: <CWL_GROUP_NAME>                    # e.g., forge-cwl-prod
  datasource:
    cwl-api-gateway:
      enabled: <CWL_API_GATEWAY_ENABLED>     # true or false
      index: <CWL_API_GATEWAY_INDEX>         # e.g., forge-prod-index
    cwl-eks:
      enabled: <CWL_EKS_ENABLED>            # true or false
      index: <CWL_EKS_INDEX>                # e.g., forge-prod-index
    cwl-lambda:
      enabled: <CWL_LAMBDA_ENABLED>         # true or false
      index: <CWL_LAMBDA_INDEX>             # e.g., forge-prod-index
  regions:
    - <AWS_REGION>                          # e.g., eu-west-1

s3_logs_config:
  s3-custom-logs:
    - enabled: <S3_CUSTOM_LOGS_ENABLED>      # true or false; add more list items for additional inputs
      name: <S3_LOGS_NAME>                  # e.g., forge-s3-logs-prod
      iam_region: <S3_LOGS_IAM_REGION>      # e.g., us-east-1; region where this input's IAM role stack is created
      index: <S3_LOGS_INDEX>                # e.g., forge-prod-index
      source_type: <S3_LOGS_SOURCE_TYPE>    # required for custom S3 logs
      sqs_urls:
        - <SQS_QUEUE_URL>                   # e.g., https://sqs.eu-west-1.amazonaws.com/123456789012/forge-s3-logs-events
      s3_bucket_patterns:
        - <S3_BUCKET_PATTERN>               # e.g., forge-runner-logs-*; use * when no narrower prefix exists
      kms_key_arns: []                      # optional; add the KMS key ARNs used by the log buckets
  ct-logs: []                               # AWS CloudTrail inputs
  s3-access-logs: []                        # Amazon S3 access-log inputs
  elb-access-logs: []                       # Elastic Load Balancing access-log inputs
  cf-access-logs: []                        # Amazon CloudFront access-log inputs

security_metadata_config:
  enabled: <SEC_META_ENABLED>               # true or false
  name: <SEC_META_NAME>                     # e.g., forge-secmeta-prod
  datasource:
    metadata:
      enabled: <SEC_META_DS_ENABLED>        # true or false
      index: <SEC_META_INDEX>               # e.g., forge-prod-index
  regions:
    - <AWS_REGION>                          # e.g., eu-west-1

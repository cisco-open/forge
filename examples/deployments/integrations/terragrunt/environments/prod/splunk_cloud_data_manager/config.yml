---
splunk_cloud: https://mycompany.splunkcloud.com

cloudformation_s3_config:
  bucket: 123456789012-short-term-storage
  key: cicd_artifacts/cf-templates/
  region: eu-west-1

cloudwatch_log_groups_config:
  enabled: true
  name: forge-cwl-prod
  datasource:
    cwl-api-gateway:
      enabled: true
      index: forge-prod-index
    cwl-eks:
      enabled: true
      index: forge-prod-index
    cwl-lambda:
      enabled: true
      index: forge-prod-index
  regions:
    - eu-west-1

s3_logs_config:
  s3-custom-logs:
    - enabled: false
      name: forge-s3-logs-prod
      iam_region: us-east-1
      index: forge-prod-index
      source_type: forgecicd:runner-logs:s3
      sqs_urls: []
      s3_bucket_patterns: []
      kms_key_arns: []
  ct-logs: []
  s3-access-logs: []
  elb-access-logs: []
  cf-access-logs: []

security_metadata_config:
  enabled: true
  name: forge-secmeta-prod
  datasource:
    metadata:
      enabled: true
      index: forge-prod-index
  regions:
    - eu-west-1
